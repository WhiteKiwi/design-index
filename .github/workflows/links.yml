name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate reference catalog
        run: ruby scripts/validate_catalog.rb

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          # These canonical sites time out, reset, block, or rate-limit GitHub-hosted clients.
          args: >-
            --verbose --no-progress
            --exclude '^https://jvns\.ca/?$'
            --exclude '^https://motion-primitives\.com/?$'
            --exclude '^https://pageflows\.com/?$'
            --exclude '^https://styledictionary\.com/?$'
            --exclude '^https://design-system\.service\.gov\.uk/?$'
            --exclude '^https://www\.siteinspire\.com/?$'
            --exclude '^https://www\.lapa\.ninja/?$'
            --exclude '^https://designspells\.com/?$'
            './**/*.md'
          fail: true
